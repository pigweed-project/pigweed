description = "Fetch and address comments on a Gerrit CL using ./gh"
prompt = """
## Code review response workflow

Use `./gh` (see `.agents/skills/ghish/SKILL.md`) to read and address Gerrit
review comments:

1.  Fetch change details and review comment threads (defaults to active branch CL):
    `./gh pr view [<CHANGE_ID>] --comments`
2.  Read the relevant files and surrounding context for each `[UNRESOLVED]` thread.
3.  List the unresolved comments (and fix them in code if requested) with file
    path and line number:
    ```
    **pw_foo/bar.cc**
    **15:** Reviewer: This variable name is a bit confusing.
    **32:** Reviewer: Should we add validation for this input?
    ```
4.  After amending (`git commit -a --amend --no-edit`) and pushing
    (`./gh pr push`), reply to each addressed thread and mark it resolved
    (pass `--draft` to stage privately for review first):
    ```bash
    ./gh pr comment [<CHANGE_ID>] --path <FILE_PATH> --line <LINE> -m "<RESPONSE>" --resolved [--draft]
    ```
"""
