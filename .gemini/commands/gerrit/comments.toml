description = "Fetch and address comments on a Gerrit CL using ./gh"
prompt = """
## Code review response workflow

Use `./gh` (see `.agents/skills/ghish/SKILL.md`) to read and address Gerrit
review comments:

1.  Fetch change details, review comment threads, and unpublished drafts (defaults to active branch CL):
    `./gh pr view [<CHANGE_ID>] --comments`
2.  Read the relevant files and surrounding context for each `[unresolved]` or `[DRAFT]` thread.
3.  List the unresolved comments (and fix them in code if requested) with file
    path and line number:
    ```
    **pw_foo/bar.cc**
    **15:** Reviewer: This variable name is a bit confusing.
    **32:** Reviewer: Should we add validation for this input?
    ```
4.  After amending (`git commit -a --amend --no-edit`) and pushing
    (`./gh pr push`), stage replies to each addressed thread and mark them
    resolved (`--path` saves as a server-side draft by default; use
    `--delete-draft` to delete a private steering draft), then run
    `./gh pr review [<CHANGE_ID>] --publish` **once** at the end if the user
    wants them published immediately:
    ```bash
    ./gh pr comment [<CHANGE_ID>] --path <FILE_PATH> --line <LINE> -m "<RESPONSE>" --resolved
    # Once all replies are staged, batch-publish in a single review:
    ./gh pr review [<CHANGE_ID>] --publish
    ```
"""
