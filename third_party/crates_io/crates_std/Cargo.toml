[package]
name = "crates_std"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "fake.rs"

[dependencies]
anyhow = "1.0.104"
bitfield-struct = "0.12.1"
bitflags = "2.13.1"
byteorder = "1.5.0"
clap = { version = "4.6.4", features = ["derive"] }
cliclack = "0.3.8"
futures = "0.3.33"
hex = "0.4.3"
libc = "0.2.189"
minijinja = { version = "2.21.0", features = ["loader"] }
nix = { version = "0.29.0", features = ["fs"] }
nom = "7.1.3"
object = { version = "0.36.7", features = ["build", "elf", "read", "write"] }
paste = "1.0.15"
proc-macro2 = "1.0.107"
prost = { version = "0.14.4", features = ["derive"] }
prost-types = "0.14.4"
protoc-gen-prost = "0.5.0"
quote = "1.0.47"
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json5 = "0.2.1"
syn = "2.0.119"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "0.8.23"
zngur = "0.10.0"
zngur-lib = "0.10.0"
zerocopy = { version = "0.8.55", features = ["derive"] }
prost-reflect = { version = "0.16.5", features = ["text-format"] }

[features]
