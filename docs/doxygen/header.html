<!-- `doxygen-site-root` provides the relative path from the current Doxygen
     page back to the main site root (e.g. `../../` for `api/cc/`). The
     universal header/nav JS component (`getSiteRootPath()` in

     paths on local/staging builds. -->

     during generation, including or stripping the enclosed HTML blocks. -->

<!-- In the default Doxygen setup, `resize.js`, `navtreedata.js`, and
     `navtree.js` are inserted at generation-time via the `treeview`
     placeholder, similar to the `search`, `mathjax`, and `darkmode`
     placeholders below. The `treeview` placeholder also causes Doxygen to
     insert a `navtree.css` stylesheet that we don't want, so that's why we no
     longer use the `treeview` placeholder and must insert the `script` tags
     for `resize.js`, `navtreedata.js`, and `navtree.js` ourselves. The
     `navtree.css` styles have been inlined into our main `styles.css` file
     and customized. -->
<script type="text/javascript" src="$relpath^resize.js"></script>
<script type="text/javascript" src="$relpath^navtreedata.js"></script>
<script type="text/javascript" src="$relpath^navtree.js"></script>
$search
$mathjax
$darkmode
<link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
$extrastylesheet
