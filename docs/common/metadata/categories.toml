[comms]
title = "Comms"
icon = "broadcast"
description = "Remote procedure calls (RPC), channels, and communication streams"
homepage = "//docs/sphinx/comms/index.rst"
pin = ["pw_rpc2", "pw_transport", "bluetooth"]

[observability]
title = "Observability"
icon = "eye"
description = "Structured logging, tokenization, metrics, crash handling, and tracing"
homepage = "//docs/sphinx/observability/index.rst"
pin = ["pw_log", "pw_tokenizer", "pw_assert", "pw_console"]

[async]
title = "Async & concurrency"
icon = "sync"
description = "Cooperative multitasking, futures, and asynchronous primitives"
homepage = "//docs/sphinx/async/index.rst"
pin = ["pw_async2", "pw_atomic", "pw_work_queue"]

[encoding]
title = "Encoding & serialization"
icon = "file-binary"
description = "Protocol Buffers, JSON, Varint, Base64, and wire format serialization"
homepage = "//docs/sphinx/encoding/index.rst"
pin = ["pw_protobuf"]

[os]
title = "OS abstraction layers"
icon = "cpu"
description = "Synchronization, threading, and portable RTOS abstractions"
homepage = "//docs/sphinx/os/index.rst"
pin = ["pw_sync", "pw_thread", "pw_chrono", "pw_interrupt", "pw_boot", "pw_system"]

[kernel]
title = "Kernel"
icon = "server"
description = "Embedded kernels, preemptive scheduling, and userspace isolation"
homepage = "//docs/sphinx/kernel/index.rst"

[memory]
title = "Memory & storage"
icon = "database"
description = "Memory allocators, buffers, persistent flash storage, and key-value stores"
homepage = "//docs/sphinx/memory/index.rst"
pin = ["pw_allocator", "pw_buf", "pw_kvs"]

[hal]
title = "HALs"
icon = "plug"
description = "Hardware abstraction layer interfaces for timers, I2C, SPI, UART, and GPIO"
homepage = "//docs/sphinx/hal/index.rst"

[hw]
title = "Hardware support"
icon = "package-dependencies"
description = "Board support, hardware drivers, and SDK integrations for target platforms"
homepage = "//docs/sphinx/hw/index.rst"
