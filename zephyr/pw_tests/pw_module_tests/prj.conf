# Enable full C++17 because we use Pigweed modules.
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y

# Enable kernel mem pool for k_aligned_alloc
CONFIG_KERNEL_MEM_POOL=y

# Console settings
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Disable slowdown to real time for faster execution in tests
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
# For global heap testing
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Increase stack sizes for C++ safety
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
