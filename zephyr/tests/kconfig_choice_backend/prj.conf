CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_LLVM_USE_LLD=y

# Each Pigweed backend is a Kconfig choice, so the application picks it here
# rather than with `select` from a Kconfig option. (Library Kconfig options
# shouldn't choose the backend for the whole application.) This test sets
# none: each choice defaults to Pigweed's Zephyr backend, which
# CMakeLists.txt checks.
