cases:

# ==============================================================================
# Basic Integers (%d, %i)
# ==============================================================================

- test_id: "int_positive"
  format_string: "%d"
  args:
    - signed_int: 42
  expected_output: "42"

- test_id: "int_negative"
  format_string: "%d"
  args:
    - signed_int: -42
  expected_output: "-42"

- test_id: "int_zero"
  format_string: "%d"
  args:
    - signed_int: 0
  expected_output: "0"

- test_id: "int_width_right"
  format_string: "%5d"
  args:
    - signed_int: 42
  expected_output: "   42"

- test_id: "int_width_left"
  format_string: "%-5d"
  args:
    - signed_int: 42
  expected_output: "42   "

- test_id: "int_zero_pad_positive"
  format_string: "%05d"
  args:
    - signed_int: 42
  expected_output: "00042"

- test_id: "int_zero_pad_negative"
  format_string: "%05d"
  args:
    - signed_int: -42
  expected_output: "-0042"

- test_id: "int_force_sign_positive"
  format_string: "%+d"
  args:
    - signed_int: 42
  expected_output: "+42"

- test_id: "int_force_sign_negative"
  format_string: "%+d"
  args:
    - signed_int: -42
  expected_output: "-42"

- test_id: "int_space_sign_positive"
  format_string: "% d"
  args:
    - signed_int: 42
  expected_output: " 42"

- test_id: "int_space_sign_negative"
  format_string: "% d"
  args:
    - signed_int: -42
  expected_output: "-42"

- test_id: "int_precision"
  format_string: "%.4d"
  args:
    - signed_int: 42
  expected_output: "0042"

- test_id: "int_precision_negative"
  format_string: "%.4d"
  args:
    - signed_int: -42
  expected_output: "-0042"

- test_id: "int_precision_zero_val_zero"
  format_string: "%.0d"
  args:
    - signed_int: 0
  expected_output: ""

- test_id: "int_width_and_precision"
  format_string: "%6.4d"
  args:
    - signed_int: 42
  expected_output: "  0042"

- test_id: "int_left_width_and_precision"
  format_string: "%-6.4d"
  args:
    - signed_int: 42
  expected_output: "0042  "

# ==============================================================================
# Unsigned Integers, Hexadecimal, and Octal (%u, %x, %X, %o)
# ==============================================================================

- test_id: "uint_basic"
  format_string: "%u"
  args:
    - unsigned_int: 12345
  expected_output: "12345"

- test_id: "uint_width"
  format_string: "%6u"
  args:
    - unsigned_int: 123
  expected_output: "   123"

- test_id: "uint_zero_pad"
  format_string: "%06u"
  args:
    - unsigned_int: 123
  expected_output: "000123"

- test_id: "hex_lower"
  format_string: "%x"
  args:
    - unsigned_int: 255
  expected_output: "ff"

- test_id: "hex_upper"
  format_string: "%X"
  args:
    - unsigned_int: 255
  expected_output: "FF"

- test_id: "hex_alt_zero"
  format_string: "%#x"
  args:
    - unsigned_int: 0
  expected_output: "0"

- test_id: "hex_zero_pad"
  format_string: "%04x"
  args:
    - unsigned_int: 42
  expected_output: "002a"

- test_id: "octal_basic"
  format_string: "%o"
  args:
    - unsigned_int: 63
  expected_output: "77"

- test_id: "octal_precision"
  format_string: "%.4o"
  args:
    - unsigned_int: 7
  expected_output: "0007"

# ==============================================================================
# Integer Length Modifiers (%hhd, %hd, %ld, %lld, %jd, %zd, %td, %llu, etc.)
# ==============================================================================

- test_id: "int_length_char"
  format_string: "%hhd"
  args:
    - signed_int: 127
  expected_output: "127"

- test_id: "int_length_char_negative"
  format_string: "%hhd"
  args:
    - signed_int: -128
  expected_output: "-128"

- test_id: "int_length_char_overflow"
  format_string: "%hhd"
  args:
    - signed_int: 300
  expected_output: "44"

- test_id: "int_length_short"
  format_string: "%hd"
  args:
    - signed_int: -32768
  expected_output: "-32768"

- test_id: "int_length_short_overflow"
  format_string: "%hd"
  args:
    - signed_int: 65537
  expected_output: "1"

- test_id: "int_length_long"
  format_string: "%ld"
  args:
    - signed_int: 123456789
  expected_output: "123456789"

- test_id: "int_length_long_long"
  format_string: "%lld"
  args:
    - signed_int: -5000000000
  expected_output: "-5000000000"

- test_id: "uint_length_char"
  format_string: "%hhu"
  args:
    - unsigned_int: 255
  expected_output: "255"

- test_id: "uint_length_char_overflow"
  format_string: "%hhu"
  args:
    - unsigned_int: 256
  expected_output: "0"

- test_id: "uint_length_short"
  format_string: "%hu"
  args:
    - unsigned_int: 65535
  expected_output: "65535"

- test_id: "uint_length_long"
  format_string: "%lu"
  args:
    - unsigned_int: 4000000000
  expected_output: "4000000000"

- test_id: "uint_length_long_long"
  format_string: "%llu"
  args:
    - unsigned_int: 5000000000
  expected_output: "5000000000"

- test_id: "int_length_intmax"
  format_string: "%jd"
  args:
    - signed_int: 12345
  expected_output: "12345"

- test_id: "int_length_size"
  format_string: "%zd"
  args:
    - signed_int: 12345
  expected_output: "12345"

- test_id: "int_length_ptrdiff"
  format_string: "%td"
  args:
    - signed_int: 12345
  expected_output: "12345"

- test_id: "int_length_long_uint_arg"
  format_string: "%ld"
  args:
    - unsigned_int: 2000000000
  expected_output: "2000000000"

- test_id: "int_length_size_uint_arg"
  format_string: "%zd"
  args:
    - unsigned_int: 2000000000
  expected_output: "2000000000"

- test_id: "int_length_ptrdiff_uint_arg"
  format_string: "%td"
  args:
    - unsigned_int: 2000000000
  expected_output: "2000000000"

- test_id: "int_length_long_long_uint_arg"
  format_string: "%lld"
  args:
    - unsigned_int: 5000000000
  expected_output: "5000000000"

# ==============================================================================
# Floating Point (%f, %F, %e, %E, %g, %G, %a, %A)
# ==============================================================================

- test_id: "float_default_precision"
  format_string: "%f"
  args:
    - floating_point: 3.14159
  expected_output: "3.141590"

- test_id: "float_fixed_precision"
  format_string: "%.2f"
  args:
    - floating_point: 3.14159
  expected_output: "3.14"

- test_id: "float_zero_precision"
  format_string: "%.0f"
  args:
    - floating_point: 3.14159
  expected_output: "3"

- test_id: "float_zero_precision_alt"
  format_string: "%#.0f"
  args:
    - floating_point: 3.14159
  expected_output: "3."

- test_id: "float_width_and_precision"
  format_string: "%8.2f"
  args:
    - floating_point: 3.14159
  expected_output: "    3.14"

- test_id: "float_left_width_and_precision"
  format_string: "%-8.2f"
  args:
    - floating_point: 3.14159
  expected_output: "3.14    "

- test_id: "float_zero_pad"
  format_string: "%08.2f"
  args:
    - floating_point: 3.14159
  expected_output: "00003.14"

- test_id: "float_negative"
  format_string: "%f"
  args:
    - floating_point: -3.14159
  expected_output: "-3.141590"

- test_id: "float_force_sign"
  format_string: "%+f"
  args:
    - floating_point: 3.14159
  expected_output: "+3.141590"

- test_id: "float_space_sign"
  format_string: "% f"
  args:
    - floating_point: 3.14159
  expected_output: " 3.141590"

- test_id: "float_upper"
  format_string: "%F"
  args:
    - floating_point: 3.14159
  expected_output: "3.141590"

- test_id: "float_exp_lower"
  format_string: "%e"
  args:
    - floating_point: 1234.56
  expected_output: "1.234560e+03"

- test_id: "float_exp_upper"
  format_string: "%E"
  args:
    - floating_point: 1234.56
  expected_output: "1.234560E+03"

- test_id: "float_exp_precision"
  format_string: "%.2e"
  args:
    - floating_point: 1234.56
  expected_output: "1.23e+03"

- test_id: "float_exp_zero"
  format_string: "%e"
  args:
    - floating_point: 0.0
  expected_output: "0.000000e+00"

- test_id: "float_general_decimal"
  format_string: "%g"
  args:
    - floating_point: 12.34
  expected_output: "12.34"

- test_id: "float_general_exp"
  format_string: "%g"
  args:
    - floating_point: 1234567.0
  expected_output: "1.23457e+06"

- test_id: "float_general_upper"
  format_string: "%G"
  args:
    - floating_point: 1234567.0
  expected_output: "1.23457E+06"

- test_id: "float_general_precision"
  format_string: "%.3g"
  args:
    - floating_point: 123.456
  expected_output: "123"

- test_id: "float_hex_lower"
  format_string: "%a"
  args:
    - floating_point: 1.0
  expected_output: "0x1p+0"

- test_id: "float_hex_upper"
  format_string: "%A"
  args:
    - floating_point: 1.0
  expected_output: "0X1P+0"

- test_id: "float_hex_precision"
  format_string: "%.2a"
  args:
    - floating_point: 1.0
  expected_output: "0x1.00p+0"

- test_id: "float_hex_precision_zero"
  format_string: "%.0a"
  args:
    - floating_point: 1.0
  expected_output: "0x1p+0"

- test_id: "float_hex_precision_zero_alt"
  format_string: "%#.0a"
  args:
    - floating_point: 1.0
  expected_output: "0x1.p+0"

- test_id: "float_hex_precision_zero_upper"
  format_string: "%.0A"
  args:
    - floating_point: 1.0
  expected_output: "0X1P+0"

- test_id: "float_hex_precision_zero_upper_alt"
  format_string: "%#.0A"
  args:
    - floating_point: 1.0
  expected_output: "0X1.P+0"

- test_id: "float_hex_zero_precision_zero"
  format_string: "%.0a"
  args:
    - floating_point: 0.0
  expected_output: "0x0p+0"

- test_id: "float_hex_zero_precision_zero_alt"
  format_string: "%#.0a"
  args:
    - floating_point: 0.0
  expected_output: "0x0.p+0"

# ==============================================================================
# Strings and Characters (%s, %c)
# ==============================================================================

- test_id: "str_basic"
  format_string: "%s"
  args:
    - string_value: "hello"
  expected_output: "hello"

- test_id: "str_width_right"
  format_string: "%8s"
  args:
    - string_value: "hello"
  expected_output: "   hello"

- test_id: "str_width_left"
  format_string: "%-8s"
  args:
    - string_value: "hello"
  expected_output: "hello   "

- test_id: "str_precision"
  format_string: "%.3s"
  args:
    - string_value: "hello"
  expected_output: "hel"

- test_id: "str_width_and_precision"
  format_string: "%8.3s"
  args:
    - string_value: "hello"
  expected_output: "     hel"

- test_id: "str_left_width_and_precision"
  format_string: "%-8.3s"
  args:
    - string_value: "hello"
  expected_output: "hel     "

- test_id: "str_multibyte_utf8_basic"
  format_string: "%s"
  args:
    - string_value: "maté"
  expected_output: "maté"

- test_id: "str_multibyte_utf8_width_right"
  format_string: "%8s"
  args:
    - string_value: "maté"
  expected_output: "   maté"

- test_id: "str_multibyte_utf8_width_left"
  format_string: "%-8s"
  args:
    - string_value: "maté"
  expected_output: "maté   "

- test_id: "str_multibyte_utf8_precision"
  format_string: "%.3s"
  args:
    - string_value: "maté"
  expected_output: "mat"

- test_id: "str_multibyte_utf8_width_and_precision"
  format_string: "%8.3s"
  args:
    - string_value: "maté"
  expected_output: "     mat"

- test_id: "char_basic"
  format_string: "%c"
  args:
    - char_value: "A"
  expected_output: "A"

- test_id: "char_width_right"
  format_string: "%3c"
  args:
    - char_value: "A"
  expected_output: "  A"

- test_id: "char_width_left"
  format_string: "%-3c"
  args:
    - char_value: "A"
  expected_output: "A  "

- test_id: "char_from_int"
  format_string: "%c"
  args:
    - signed_int: 65
  expected_output: "A"

- test_id: "char_from_uint"
  format_string: "%c"
  args:
    - unsigned_int: 97
  expected_output: "a"

# ==============================================================================
# Pointers (%p)
# ==============================================================================

- test_id: "ptr_nonzero_small"
  format_string: "%p"
  args:
    - pointer_value: 1
  expected_output: "0x1"

- test_id: "ptr_nonzero"
  format_string: "%p"
  args:
    - pointer_value: 4660
  expected_output: "0x1234"

- test_id: "ptr_width"
  format_string: "%8p"
  args:
    - pointer_value: 4660
  expected_output: "  0x1234"

# ==============================================================================
# Percent Escapes (%%)
# ==============================================================================

- test_id: "percent_only"
  format_string: "%%"
  expected_output: "%"

- test_id: "percent_in_text"
  format_string: "100%% complete"
  expected_output: "100% complete"

- test_id: "percent_with_int"
  format_string: "%d%%"
  args:
    - signed_int: 50
  expected_output: "50%"

# ==============================================================================
# Dynamic Width and Precision (%*, %.*)
# ==============================================================================

- test_id: "dynamic_width_int"
  format_string: "%*d"
  args:
    - signed_int: 5
    - signed_int: 42
  expected_output: "   42"

- test_id: "dynamic_width_int_negative"
  format_string: "%*d"
  args:
    - signed_int: -5
    - signed_int: 42
  expected_output: "42   "

- test_id: "dynamic_precision_str"
  format_string: "%.*s"
  args:
    - signed_int: 3
    - string_value: "hello"
  expected_output: "hel"

- test_id: "dynamic_width_and_precision_float"
  format_string: "%*.*f"
  args:
    - signed_int: 8
    - signed_int: 2
    - floating_point: 3.14159
  expected_output: "    3.14"

# ==============================================================================
# Multi-Argument Test Cases
# ==============================================================================

- test_id: "multi_now_there_are_them"
  format_string: "Now there are %d of %s!"
  args:
    - signed_int: 2
    - string_value: "them"
  expected_output: "Now there are 2 of them!"

- test_id: "multi_use_the_force"
  format_string: "Use the %s, %s."
  args:
    - string_value: "force"
    - string_value: "Luke"
  expected_output: "Use the force, Luke."

- test_id: "multi_math_formula"
  format_string: "%d + %d = %d"
  args:
    - signed_int: 10
    - signed_int: 20
    - signed_int: 30
  expected_output: "10 + 20 = 30"

- test_id: "multi_mixed_types"
  format_string: "Item %s: ID=%04x, Price=$%.2f, Grade=%c"
  args:
    - string_value: "Widget"
    - unsigned_int: 42
    - floating_point: 19.99
    - char_value: "A"
  expected_output: "Item Widget: ID=002a, Price=$19.99, Grade=A"

# ==============================================================================
# Edge Cases: Alternate Form, Precision, Padding, Zero & NaN Formatting
# ==============================================================================

- test_id: "oct_prec_0_zero"
  format_string: "[%.0o]"
  args:
    - unsigned_int: 0
  expected_output: "[]"

- test_id: "oct_prec_0_eight"
  format_string: "[%.0o]"
  args:
    - unsigned_int: 8
  expected_output: "[10]"

- test_id: "oct_alt_prec_0_zero"
  format_string: "[%#.0o]"
  args:
    - unsigned_int: 0
  expected_output: "[0]"

- test_id: "oct_alt_prec_0_eight"
  format_string: "[%#.0o]"
  args:
    - unsigned_int: 8
  expected_output: "[010]"

- test_id: "oct_alt_zero"
  format_string: "[%#o]"
  args:
    - unsigned_int: 0
  expected_output: "[0]"

- test_id: "oct_alt_eight"
  format_string: "[%#o]"
  args:
    - unsigned_int: 8
  expected_output: "[010]"

- test_id: "oct_alt_width_zero"
  format_string: "[%#8o]"
  args:
    - unsigned_int: 0
  expected_output: "[       0]"

- test_id: "oct_alt_width_eight"
  format_string: "[%#8o]"
  args:
    - unsigned_int: 8
  expected_output: "[     010]"

- test_id: "oct_alt_prec_3_one"
  format_string: "[%#.3o]"
  args:
    - unsigned_int: 1
  expected_output: "[001]"

- test_id: "hex_alt_zero_bracketed"
  format_string: "[%#x]"
  args:
    - unsigned_int: 0
  expected_output: "[0]"

- test_id: "hex_alt_16"
  format_string: "[%#x]"
  args:
    - unsigned_int: 16
  expected_output: "[0x10]"

- test_id: "upper_hex_alt_zero"
  format_string: "[%#X]"
  args:
    - unsigned_int: 0
  expected_output: "[0]"

- test_id: "upper_hex_alt_16"
  format_string: "[%#X]"
  args:
    - unsigned_int: 16
  expected_output: "[0X10]"

- test_id: "hex_alt_prec_0_zero"
  format_string: "[%#.0x]"
  args:
    - unsigned_int: 0
  expected_output: "[]"

- test_id: "hex_alt_prec_0_16"
  format_string: "[%#.0x]"
  args:
    - unsigned_int: 16
  expected_output: "[0x10]"

- test_id: "hex_alt_zero_pad_zero"
  format_string: "[%#08x]"
  args:
    - unsigned_int: 0
  expected_output: "[00000000]"

- test_id: "hex_alt_zero_pad_16"
  format_string: "[%#08x]"
  args:
    - unsigned_int: 16
  expected_output: "[0x000010]"

- test_id: "int_zero_pad_prec_0_one"
  format_string: "[%06.0d]"
  args:
    - signed_int: 1
  expected_output: "[     1]"

- test_id: "g_alt_prec_0_2_5"
  format_string: "[%#.0g]"
  args:
    - floating_point: 2.5
  expected_output: "[2.]"

- test_id: "upper_g_alt_prec_0_2_5"
  format_string: "[%#.0G]"
  args:
    - floating_point: 2.5
  expected_output: "[2.]"

- test_id: "g_alt_prec_0_float"
  format_string: "[%#.0g]"
  args:
    - floating_point: 1.234567
  expected_output: "[1.]"

- test_id: "upper_g_alt_prec_0_float"
  format_string: "[%#.0G]"
  args:
    - floating_point: 1.234567
  expected_output: "[1.]"

- test_id: "g_alt_prec_0_100k"
  format_string: "[%#.0g]"
  args:
    - floating_point: 100000.0
  expected_output: "[1.e+05]"

- test_id: "upper_g_alt_prec_0_100k"
  format_string: "[%#.0G]"
  args:
    - floating_point: 100000.0
  expected_output: "[1.E+05]"

- test_id: "f_nan"
  format_string: "[%f]"
  args:
    - floating_point: .nan
  expected_output: "[nan]"

- test_id: "f_alt_prec_0_one"
  format_string: "[%#.0f]"
  args:
    - floating_point: 1.0
  expected_output: "[1.]"

- test_id: "f_zero_nan"
  format_string: "[%0f]"
  args:
    - floating_point: .nan
  expected_output: "[nan]"

- test_id: "f_left_zero_pad_nan"
  format_string: "[%-010f]"
  args:
    - floating_point: .nan
  expected_output: "[nan       ]"

# ==============================================================================
# Error Handling Test Cases (Missing and Mismatched Arguments)
# ==============================================================================

- test_id: "err_missing_arg_single"
  format_string: "The number is %d"
  expected_output: "The number is %d"
  skip_snprintf: "Pigweed leaves specifier literal when argument is missing"

- test_id: "err_missing_arg_multi"
  format_string: "%d + %d = %d"
  args:
    - signed_int: 1
    - signed_int: 2
  expected_output: "1 + 2 = %d"
  skip_snprintf: "Pigweed leaves specifier literal when argument is missing"

- test_id: "err_missing_all_args"
  format_string: "%s: %d items (%f percent)"
  expected_output: "%s: %d items (%f percent)"
  skip_snprintf: "Pigweed leaves specifier literal when argument is missing"

- test_id: "err_type_mismatch_int_for_string"
  format_string: "Name: %s"
  args:
    - signed_int: 123
  expected_output: "Name: %s"
  skip_snprintf: "Pigweed leaves specifier literal on argument type mismatch"

- test_id: "err_type_mismatch_str_for_int"
  format_string: "Value: %d"
  args:
    - string_value: "hello"
  expected_output: "Value: %d"
  skip_snprintf: "Pigweed leaves specifier literal on argument type mismatch"

- test_id: "err_type_mismatch_str_for_float"
  format_string: "Value: %f"
  args:
    - string_value: "hello"
  expected_output: "Value: %f"
  skip_snprintf: "Pigweed leaves specifier literal on argument type mismatch"

- test_id: "err_type_mismatch_float_for_pointer"
  format_string: "Addr: %p"
  args:
    - floating_point: 3.14
  expected_output: "Addr: %p"
  skip_snprintf: "Pigweed leaves specifier literal on argument type mismatch"

- test_id: "err_dynamic_width_missing"
