syntax = "proto3";

package examples;

message GetTemperatureRequest {}

message GetTemperatureResponse {
  int32 temp_celsius = 1;
}

// Queries a temperature measurement from a sensor.
service Sensor {
  rpc GetTemperature(GetTemperatureRequest) returns (GetTemperatureResponse);
}

message GetTemperatureAggregatesRequest {}

message GetTemperatureAggregatesResponse {
  int32 min_temp_celsius = 1;
  int32 max_temp_celsius = 2;
  int32 avg_temp_celsius = 3;
}

// Aggregates temperature measurements from multiple sensors.
service SensorAggregator {
  rpc GetTemperatureAggregates(GetTemperatureAggregatesRequest)
      returns (GetTemperatureAggregatesResponse);
}
