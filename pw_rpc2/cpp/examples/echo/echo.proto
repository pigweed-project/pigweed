syntax = "proto3";

package examples;

// A text message. `echo.pwpb_options` gives `msg` a fixed capacity.
message EchoMessage {
  string msg = 1;
}

// Asks the server to send `msg` back `count` times.
message RepeatRequest {
  string msg = 1;
  uint32 count = 2;
}

// Demonstrates each of the four types of RPC.
service Echo {
  // Unary: responds with the request.
  rpc Echo(EchoMessage) returns (EchoMessage);

  // Server streaming: sends `msg` back `count` times.
  rpc Repeat(RepeatRequest) returns (stream EchoMessage);

  // Client streaming: after the client finishes its stream, responds with the
  // messages joined by spaces.
  rpc Collect(stream EchoMessage) returns (EchoMessage);

  // Bidirectional streaming: sends each message back as it arrives.
  rpc EchoStream(stream EchoMessage) returns (stream EchoMessage);
}
