syntax = "proto3";

// Exercises names that generated code must fully qualify.
//
// The first package component matches `pw::rpc2`, which is visible from
// `pw::rpc2::internal`, where serializers are looked up.
package rpc2.codegen_test;

import "pw_rpc2/codegen_test_protos/common.proto";

message Ping {
  uint32 value = 1;
}

message Pong {
  uint32 value = 1;
}

// A message named with a C++ keyword.
message delete {
  uint32 value = 1;
}

message Outer {
  message Inner {
    uint32 value = 1;
  }
}

service Names {
  // Methods with the same names as the messages they use. protoc resolves an
  // unqualified type name to the method, so the types are fully qualified.
  rpc Ping(.rpc2.codegen_test.Ping) returns (.rpc2.codegen_test.Pong);
  rpc Pong(.rpc2.codegen_test.Ping) returns (.rpc2.codegen_test.Pong);
  rpc Delete(delete) returns (delete);
  rpc Nested(Outer.Inner) returns (Outer.Inner);
}

// Covers all four method kinds with imported and nested messages.
service Kinds {
  rpc Unary(pw.rpc2.codegen_test.common.Shared)
      returns (pw.rpc2.codegen_test.common.Outer.Inner);
  rpc ServerStream(pw.rpc2.codegen_test.common.Shared)
      returns (stream pw.rpc2.codegen_test.common.Shared);
  rpc ClientStream(stream pw.rpc2.codegen_test.common.Shared)
      returns (pw.rpc2.codegen_test.common.Shared);
  rpc Bidi(stream pw.rpc2.codegen_test.common.Shared)
      returns (stream pw.rpc2.codegen_test.common.Shared);
}

// Methods named after client and service base class APIs: `Copy` (as in
// `client.Method::Copy()`), `Reserve`, the class that provides `Copy()`,
// unprefixed internal names (`internal`, `derived`, `Impl`, `Size`,
// `kServiceId`, `ClientCopyMethods`), and members of `ServiceClient`,
// `GeneratedServiceClient`, and `pw::rpc2::Service` that user methods may
// shadow.
service ClientApiNames {
  rpc Copy(Ping) returns (Pong);
  rpc Reserve(Ping) returns (stream Pong);
  rpc UnaryCopyMethod(Ping) returns (Pong);
  rpc ClientCopyMethods(Ping) returns (Pong);
  rpc internal(Ping) returns (Pong);
  rpc derived(Ping) returns (Pong);
  rpc Impl(Ping) returns (Pong);
  rpc Size(Ping) returns (Pong);
  rpc kServiceId(Ping) returns (Pong);
  rpc CallUnary(Ping) returns (Pong);
  rpc client(Ping) returns (Pong);
  rpc is_open(Ping) returns (Pong);
  rpc FindMethod(Ping) returns (Pong);
  rpc methods(Ping) returns (Pong);
  rpc service_id(Ping) returns (Pong);
}
