syntax = "proto3";

package pw.rpc2.mixed_apis;

service MixedApi {
  // Unary: all three styles, in both encodings.
  rpc PwpbFutureUnary(MixedRequest) returns (MixedResponse);
  rpc PwpbFactoryUnary(MixedRequest) returns (MixedResponse);
  rpc PwpbCoroUnary(MixedRequest) returns (MixedResponse);
  rpc RawFutureUnary(MixedRequest) returns (MixedResponse);
  rpc RawFactoryUnary(MixedRequest) returns (MixedResponse);
  rpc RawCoroUnary(MixedRequest) returns (MixedResponse);

  // Server streaming.
  rpc PwpbFutureServerStream(MixedRequest) returns (stream MixedResponse);
  rpc RawCoroServerStream(MixedRequest) returns (stream MixedResponse);

  // Client streaming.
  rpc PwpbCoroClientStream(stream MixedRequest) returns (MixedResponse);
  rpc RawFactoryClientStream(stream MixedRequest) returns (MixedResponse);

  // Bidirectional streaming.
  rpc PwpbFactoryBidiStream(stream MixedRequest) returns (stream MixedResponse);
  rpc RawFutureBidiStream(stream MixedRequest) returns (stream MixedResponse);
}

message MixedRequest {
  uint32 value = 1;
}

message MixedResponse {
  uint32 value = 1;
}
