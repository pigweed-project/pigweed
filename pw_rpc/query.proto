syntax = "proto3";

package pw.rpc;

option java_package = "dev.pigweed.pw_rpc.proto";

service Query {
  rpc ListServices(ListServicesRequest) returns (stream ListServicesResponse) {}
  rpc ListMethods(ListMethodsRequest) returns (stream ListMethodsResponse) {}
  rpc IsServiceAvailable(IsServiceAvailableRequest)
      returns (IsAvailableResponse) {}
  rpc IsMethodAvailable(IsMethodAvailableRequest)
      returns (IsAvailableResponse) {}
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated uint32 service_ids = 1;
}

message ListMethodsRequest {
  uint32 service_id = 1;
}

message ListMethodsResponse {
  repeated uint32 method_ids = 1;
}

message IsServiceAvailableRequest {
  uint32 service_id = 1;
}

message IsAvailableResponse {
  bool is_available = 1;
}

message IsMethodAvailableRequest {
  uint32 service_id = 1;
  uint32 method_id = 2;
}
