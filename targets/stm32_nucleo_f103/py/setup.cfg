[metadata]
name = stm32_nucleo_f103_utils
version = 0.0.1
author = Pigweed Authors
author_email = pigweed-developers@googlegroups.com
description = Target-specific Python utilities for the STM32 Nucleo-F103RB target

[options]
packages = find:
zip_safe = False
install_requires =
    pyserial~=3.5.0

[options.entry_points]
console_scripts =
    stm32_nucleo_f103_detector = stm32_nucleo_f103_utils.device_detector:main
    stm32_nucleo_f103_flasher = stm32_nucleo_f103_utils.flasher:main
    stm32_nucleo_f103_unit_test_client = stm32_nucleo_f103_utils.unit_test_client:main
    stm32_nucleo_f103_unit_test_runner = stm32_nucleo_f103_utils.unit_test_runner:main
    stm32_nucleo_f103_unit_test_server = stm32_nucleo_f103_utils.unit_test_server:main

[options.package_data]
stm32_nucleo_f103_utils = py.typed
