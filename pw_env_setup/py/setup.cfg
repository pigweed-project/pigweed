[metadata]
name = pw_env_setup
version = 0.0.1
author = Pigweed Authors
author_email = pigweed-developers@googlegroups.com
description = Environment setup for Pigweed

[options]
packages = find:
zip_safe = False
install_requires =
    setuptools  # For import pkg_resources
    six
    types-six

[options.entry_points]
console_scripts =
    _pw_env_setup = pw_env_setup.env_setup:main
    arm-none-eabi-gdb = pw_env_setup.entry_points.arm_gdb:main

# LINT.IfChange(pw_env_setup_cipd_files)
[options.package_data]
pw_env_setup =
    cipd_setup/.cipd_version
    cipd_setup/.cipd_version.digests
    cipd_setup/arm.json
    cipd_setup/bazelisk.json
    cipd_setup/buildifier.json
    cipd_setup/clang.json
    cipd_setup/cmake.json
    cipd_setup/compatibility.json
    cipd_setup/coverage.json
    cipd_setup/default.json
    cipd_setup/doxygen.json
    cipd_setup/flatc.json
    cipd_setup/go.json
    cipd_setup/host_tools.json
    cipd_setup/kythe.json
    cipd_setup/luci.json
    cipd_setup/msrv_python.json
    cipd_setup/openjdk.json
    cipd_setup/pigweed.json
    cipd_setup/python.json
    cipd_setup/python310.json
    cipd_setup/python311.json
    cipd_setup/python313.json
    cipd_setup/python314.json
    cipd_setup/rbe.json
    cipd_setup/riscv.json
    cipd_setup/rust.json
    cipd_setup/testing.json
    cipd_setup/upstream.json
    cipd_setup/web.json
    cipd_setup/zephyr_sdk.json
    py.typed
    virtualenv_setup/constraint.list
    virtualenv_setup/constraint_hashes_darwin.list
    virtualenv_setup/constraint_hashes_linux.list
    virtualenv_setup/constraint_hashes_windows.list
    virtualenv_setup/pigweed_upstream_requirements.txt
    virtualenv_setup/python_base_requirements.txt
    virtualenv_setup/upstream_requirements_darwin_lock.txt
    virtualenv_setup/upstream_requirements_linux_lock.txt
    virtualenv_setup/upstream_requirements_windows_lock.txt
# LINT.ThenChange(pw_env_setup/py/BUILD.bazel,pw_env_setup/py/BUILD.gn,pw_env_setup/py/setup.cfg)
