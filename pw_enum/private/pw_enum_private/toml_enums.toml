namespace = "pw.enum_test"
cc.namespace = "pw::enum_test::toml"

[enums.TomlEnum]
type = "int16"
doc = "Enum for testing TOML enum definitions."
values = [
  { name = "NEGATIVE", value = -2 },
  { name = "FIRST", value = 0, doc = "The first value." },
  { name = "SECOND" },
  { name = "ALIAS_SECOND", value = "SECOND" },
  { name = "FROM_BASE", value = "JsonBaseEnum.TEN + 1" },
  { name = "CUSTOM", display_name = "custom_name", cc = { name = "kCustomName" } },
]

[enums.TomlCode]
type = "uint8"
status = { name = "TomlStatus", ok = "OK" }
values = [
  { name = "OK" },
  { name = "BUSY" },
  { name = "BROKEN", value = "1 << 4" },
]
